<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الألغاز المباشر - نمط المليون</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* حاوية البث الطولية بأبعاد التيك توك */
        .stream-container {
            width: 450px;
            height: 800px;
            background: radial-gradient(circle at center, #1a1a3a 0%, #07070f 100%);
            border: 3px solid #3a3a78;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 35px 25px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(58, 58, 120, 0.3);
            position: relative;
        }

        /* الرأس وتأثير الإضاءة */
        .header {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(5px);
            padding: 20px 15px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .header h1 {
            font-size: 26px;
            color: #ffd700; /* لون ذهبي فخم */
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
            margin-bottom: 5px;
        }

        .header p {
            font-size: 15px;
            color: #25f4ee;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(37, 244, 238, 0.3);
        }

        /* صندوق السؤال المستوحى من من سيربح المليون */
        .quiz-box {
            background: linear-gradient(90deg, rgba(16, 16, 48, 0.9) 0%, rgba(28, 28, 70, 0.9) 50%, rgba(16, 16, 48, 0.9) 100%);
            border-top: 2px solid #3a3a78;
            border-bottom: 2px solid #3a3a78;
            border-left: 2px solid #ffd700;
            border-right: 2px solid #ffd700;
            border-radius: 40px; /* زوايا دائرية مميزة للسؤال */
            padding: 25px 20px;
            text-align: center;
            min-height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(58, 58, 120, 0.5);
        }

        .question {
            font-size: 22px;
            line-height: 1.6;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* العداد التنازلي الدائري */
        .timer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
        }

        .timer {
            font-size: 42px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            background: #07070f;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        /* نظام الشبكة: خيارين بجانب بعض في صفين */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* تقسيم العرض إلى نصفين متساويين */
            gap: 15px;
            margin-bottom: 10px;
        }

        /* ستايل كرت الخيار المستوحى من البرنامج */
        .option-card {
            background: linear-gradient(180deg, #161638 0%, #0d0d26 100%);
            border: 1.5px solid #3a3a78;
            border-radius: 30px; /* حواف دائرية انسيابية */
            padding: 15px;
            min-height: 65px;
            display: flex;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: all 0.4s ease;
        }

        /* بادئة الحرف (أ: ، ب:) باللون الذهبي */
        .option-prefix {
            color: #ffd700;
            font-weight: bold;
            font-size: 18px;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .option-text {
            font-size: 16px;
            color: #e0e0e0;
            font-weight: 500;
            word-break: break-word;
        }

        /* تأثير الإجابة الصحيحة (توهج أخضر كامل) */
        .option-card.correct {
            border-color: #00ff66;
            background: linear-gradient(180deg, #004d1a 0%, #00260d 100%);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
            animation: pulse 1s infinite alternate;
        }
        
        .option-card.correct .option-prefix,
        .option-card.correct .option-text {
            color: #00ff66;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
        }

        /* حركة نبض للإجابة الصحيحة لشد الانتباه */
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        .footer {
            text-align: center;
            font-size: 13px;
            color: #555577;
            border-top: 1px solid rgba(58, 58, 120, 0.3);
            padding-top: 15px;
        }
        
        .footer span {
            color: #fe2c55;
            font-weight: bold;
        }
    </style>
</head>
<body>

            // إظهار الإجابة الصحيحة باللون الأخضر ونبض الأنيميشن المثير
            document.getElementById(`opt-${correctLetter}`).classList.add('correct');

            // الانتظار 5 ثوانٍ ليشاهد الجميع الحل، ثم الانتقال تلقائياً للغز التالي
            setTimeout(() => {
                currentQuizIndex++;
                if (currentQuizIndex >= quizData.length) {
                    currentQuizIndex = 0; 
                }
                loadQuiz();
            }, 5000);
        }

        window.onload = loadQuiz;
    </script>
</body>
</html>
